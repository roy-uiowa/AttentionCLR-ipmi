[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "attentionclr"
version = "0.1.0"
description = "Reproduction + extension of Matek et al. 2021 (Blood) bone marrow cell classification."
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "lightning>=2.2",
  "timm>=0.9",
  "torchmetrics>=1.3",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14.0",
  "scikit-learn>=1.4",
  "pyyaml>=6.0",
  "pillow>=10.0",
  "opencv-python-headless>=4.8",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "umap-learn>=0.5",
  "tqdm>=4.66",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "ruff>=0.3",
  "mypy>=1.9",
  "pre-commit>=3.6",
  "ipykernel>=6.29",
  "jupyterlab>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
